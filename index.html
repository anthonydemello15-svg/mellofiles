<!DOCTYPE html>

<html>

<head>

<title>MelloFiles</title>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:
linear-gradient(
180deg,
#000,
#041104
);

font-family:Arial;

color:white;

}

.hero{

text-align:center;

padding:60px 20px;

}

.logo{

width:220px;

margin-bottom:25px;

}

.hero h1{

font-size:34px;

color:#00ff66;

}

.hero p{

color:#aaa;

margin-top:12px;

}

.container{

padding:25px;

max-width:600px;

margin:auto;

}

.folder{

display:block;

background:

linear-gradient(
145deg,
#0d0d0d,
#101810
);

border:

2px solid #00ff66;

padding:28px;

margin-bottom:22px;

border-radius:24px;

text-decoration:none;

color:white;

box-shadow:

0 0 30px
rgba(0,255,100,.18);

}

.folder:hover{

transform:
translateY(-3px);

}

.folder h2{

color:#00ff66;

margin-bottom:10px;

font-size:26px;

}

.folder p{

color:#aaa;

}

.stats{

display:flex;

justify-content:center;

gap:14px;

margin-top:30px;

}

.box{

background:#111;

padding:12px 18px;

border-radius:14px;

}

footer{

text-align:center;

padding:40px;

color:#666;

}

</style>

</head>

<body>

<section class="hero">

<img
src="logo.png"
class="logo">

<h1>MelloFiles</h1>

<p>
Choose a category
</p>

<div class="stats">

<div class="box">
🎬 Movies
</div>

<div class="box">
📝 Subtitles
</div>

</div>

</section>

<div class="container">

<a
href="movies.html"
class="folder">

<h2>
🎬 Movies / Series
</h2>

<p>

Browse download websites

</p>

</a>

<a
href="subtitles.html"
class="folder">

<h2>
📝 Subtitles
</h2>

<p>

Find subtitle websites

</p>

</a>

</div>

<footer>

MelloFiles

</footer>

</body>

</html>
