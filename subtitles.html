<!DOCTYPE html>

<html>

<head>

<title>Subtitles • MelloFiles</title>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;

color:white;

font-family:Arial;

}

header{

padding:25px;

text-align:center;

}

header h1{

color:#00ff66;

}

header p{

color:#999;

margin-top:8px;

}

.back{

display:inline-block;

margin-top:15px;

color:#00ff66;

text-decoration:none;

}

.grid{

padding:20px;

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(
160px,
1fr
)

);

gap:18px;

}

.card{

background:#111;

border:

1px solid #00ff66;

border-radius:18px;

overflow:hidden;

}

.card img{

width:100%;

height:150px;

object-fit:cover;

background:#111;

}

.card-content{

padding:15px;

}

.card h3{

margin-bottom:10px;

}

.visit-btn{

display:inline-block;

padding:

10px 16px;

background:#00cc55;

color:white;

text-decoration:none;

border-radius:10px;

}

.visit-btn:hover{

background:#00ff66;

}

</style>

</head>

<body>

<header>

<h1>
📝 Subtitle Websites
</h1>

<p>

Choose where to download subtitles

</p>

<a
href="index.html"
class="back">

← Back

</a>

</header>

<div class="grid">

<!-- MySubs -->

<div class="card">

<img src="mysubs.png">

<div class="card-content">

<h3>MySubs</h3>

<a
href="https://my-subs.co/"
target="_blank"
class="visit-btn">

Visit

</a>

</div>

</div>

<!-- SubtitleCat -->

<div class="card">

<img src="subtitlecat.png">

<div class="card-content">

<h3>SubtitleCat</h3>

<a
href="https://www.subtitlecat.com/"
target="_blank"
class="visit-btn">

Visit

</a>

</div>

</div>

<!-- TvSubtitles -->

<div class="card">

<img src="tvsubtitles.png">

<div class="card-content">

<h3>TvSubtitles</h3>

<a
href="https://www.tvsubtitles.net/"
target="_blank"
class="visit-btn">

Visit

</a>

</div>

</div>

</div>

</body>

</html>
